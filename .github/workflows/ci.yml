name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build --configuration Release --no-restore

      - name: Run unit and integration tests
        run: dotnet test --configuration Release --no-build --filter "Category!=Benchmark" --logger "trx;LogFileName=test-results-${{ matrix.os }}.trx" --results-directory ./TestResults

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults/*.trx

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish and package release archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.0.0"
          if [ -f "Directory.Build.props" ]; then
              DETECTED_VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" Directory.Build.props || true)
              if [ -n "${DETECTED_VERSION}" ]; then
                  VERSION="${DETECTED_VERSION}"
              fi
          fi

          mkdir -p dist artifacts/linux-x64 artifacts/win-x64

          dotnet publish src/Mycel.App/Mycel.App.csproj \
              -c Release \
              -r linux-x64 \
              --self-contained \
              -p:PublishSingleFile=true \
              -p:PublishReadyToRun=true \
              -p:EnableCompressionInSingleFile=true \
              -o artifacts/linux-x64 \
              --nologo
          cp LICENSE THIRD_PARTY_NOTICES.md artifacts/linux-x64/
          mkdir -p artifacts/linux-x64/packaging/linux
          cp -r packaging/linux/* artifacts/linux-x64/packaging/linux/
          mkdir -p artifacts/linux-x64/icons
          cp src/Mycel.App/Assets/icons/*.png artifacts/linux-x64/icons/
          tar -czf "dist/Mycel-${VERSION}-linux-x64.tar.gz" -C artifacts/linux-x64 .

          dotnet publish src/Mycel.App/Mycel.App.csproj \
              -c Release \
              -r win-x64 \
              --self-contained \
              -p:PublishSingleFile=true \
              -p:PublishReadyToRun=true \
              -p:EnableCompressionInSingleFile=true \
              -o artifacts/win-x64 \
              --nologo
          cp LICENSE THIRD_PARTY_NOTICES.md artifacts/win-x64/
          (cd artifacts/win-x64 && zip -q -r "../../dist/Mycel-${VERSION}-win-x64.zip" .)

      - name: Upload Linux release archive
        uses: actions/upload-artifact@v4
        with:
          name: Mycel-linux-x64
          path: dist/Mycel-*-linux-x64.tar.gz

      - name: Upload Windows release archive
        uses: actions/upload-artifact@v4
        with:
          name: Mycel-win-x64
          path: dist/Mycel-*-win-x64.zip

